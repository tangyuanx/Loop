name: Diagnose desktop release gates

on:
  push:
    branches: [codex/loop-native-release-diagnosis]

permissions:
  contents: read

jobs:
  native-gates:
    name: Packaged Windows table headers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win -- --dir --publish never
      - name: Select actual packaged executable
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "release/win-unpacked/Loop.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Packaged Loop.exe is missing." }
          "LOOP_APP_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check packaged table headers, editing and undo
        run: node tests/knowledge-table-headers.ui.cjs
      - name: Preserve table header evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-table-header-evidence
          path: .local-review/table-headers-*/result.json
          include-hidden-files: true
