name: Release Desktop Apps

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare unpublished release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/release-draft.cjs prepare
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Release ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Trusted versioned source; the script rejects uploads to published releases.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/bug-report/package-lock.json
      - name: Cache Electron and builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Cache historical Windows upgrade installers
        if: matrix.platform == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/loop-upgrade-installer-fixture/installers
          key: windows-upgrade-installers-151-152-153-v1
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Select packaged macOS app for knowledge regression
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          executable="$PWD/release/mac-arm64/Loop.app/Contents/MacOS/Loop"
          if [ ! -x "$executable" ]; then executable="$PWD/release/mac/Loop.app/Contents/MacOS/Loop"; fi
          test -x "$executable"
          echo "LOOP_APP_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - name: Select packaged Windows app for knowledge regression
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "release/win-unpacked/Loop.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Packaged Loop.exe is missing." }
          "LOOP_APP_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test packaged knowledge notes before publishing
        env:
          LOOP_KNOWLEDGE_QA_DIR: ${{ runner.temp }}/knowledge-export
          LOOP_CONFLICT_QA_DIR: ${{ runner.temp }}/knowledge-conflict
          LOOP_FEEDBACK_QA_DIR: ${{ runner.temp }}/knowledge-feedback
          LOOP_SEARCH_QA_DIR: ${{ runner.temp }}/knowledge-search
        run: npm run test:ui:knowledge-release
      - name: Preserve packaged knowledge regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/knowledge-export/evidence
            ${{ runner.temp }}/knowledge-conflict/evidence
            ${{ runner.temp }}/knowledge-feedback/evidence
            ${{ runner.temp }}/knowledge-search/evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Verify update metadata against real bytes
        run: node tools/verify-update-artifacts.cjs release
      - name: Upload verified assets directly to draft
        run: node tools/release-draft.cjs upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      # Only manifests travel to the final job. Installers, blockmaps,
      # release/latest.yml and release/latest-mac.yml are already in the draft.
      - name: Stage platform verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.platform }}
          path: release-manifests/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete verified release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect small verification manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          path: release-manifests
          merge-multiple: true
      - name: Verify complete cross-platform feed and publish draft
        # Equivalent --require-all-platforms gate: verified local feed SHA-512
        # plus GitHub's server SHA-256 of every uploaded asset.
        run: node tools/release-draft.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
