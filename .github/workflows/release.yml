name: Release Desktop Apps

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check source and prepare unpublished release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/bug-report/package-lock.json
      - run: npm ci
      - name: Check source once before platform builds
        run: npm run check
      - run: node tools/release-draft.cjs prepare
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Release ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Trusted versioned source; the script rejects uploads to published releases.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: npm run dist:mac -- --x64 --arm64 --publish never
          - platform: Windows
            os: windows-latest
            script: npm run dist:win -- --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/bug-report/package-lock.json
      - name: Cache Electron and builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: packaging-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build app
        run: ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Check native desktop behavior
        # Keep OS-dependent storage and window checks without repeating the
        # complete editor builds, service checks and source suite per platform.
        run: |
          node --test tests/desktop.test.cjs
          node tests/flow-outline.ui.cjs
          npm run test:ui:flow-navigation
          npm run test:ui:node-draft
          npm run test:ui:knowledge-split-tabs
          node tests/node-interactions.ui.cjs
          node tests/flow-completed-filter.ui.cjs
      - name: Cache historical Windows upgrade installers
        if: matrix.platform == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/loop-upgrade-installer-fixture/installers
          key: windows-upgrade-installers-151-152-153-v1
      - name: Test Windows installer upgrade matrix
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $candidate = Get-ChildItem release -Filter "Loop-*-x64-setup.exe" | Select-Object -First 1
          if (-not $candidate) { throw "Windows installer was not produced." }
          ./tests/windows-upgrade-installer.test.ps1 -CandidateInstaller $candidate.FullName
      - name: Select packaged macOS app for knowledge regression
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          executable="$PWD/release/mac-arm64/Loop.app/Contents/MacOS/Loop"
          if [ ! -x "$executable" ]; then executable="$PWD/release/mac/Loop.app/Contents/MacOS/Loop"; fi
          test -x "$executable"
          echo "LOOP_APP_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - name: Select packaged Windows app for knowledge regression
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "release/win-unpacked/Loop.exe"
          if (-not (Test-Path -LiteralPath $executable)) { throw "Packaged Loop.exe is missing." }
          "LOOP_APP_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test packaged knowledge notes before publishing
        env:
          LOOP_KNOWLEDGE_QA_DIR: ${{ runner.temp }}/knowledge-export
          LOOP_CONFLICT_QA_DIR: ${{ runner.temp }}/knowledge-conflict
          LOOP_FEEDBACK_QA_DIR: ${{ runner.temp }}/knowledge-feedback
          LOOP_SEARCH_QA_DIR: ${{ runner.temp }}/knowledge-search
        run: npm run test:ui:knowledge-release
      - name: Preserve packaged knowledge regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/knowledge-export/evidence
            ${{ runner.temp }}/knowledge-conflict/evidence
            ${{ runner.temp }}/knowledge-feedback/evidence
            ${{ runner.temp }}/knowledge-search/evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Export sample with the packaged Loop application
        env:
          LOOP_TASK_SHARE_QA_DIR: ${{ runner.temp }}/task-share-evidence
        run: node tests/task-share-packaged.ui.cjs produce "${{ runner.temp }}/task-share-evidence/sample.looptask"
      - name: Preserve task-package sender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-share-sender-${{ matrix.platform }}
          path: ${{ runner.temp }}/task-share-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the packaged candidate for cross-platform verification
        uses: actions/upload-artifact@v4
        with:
          name: task-share-candidate-${{ matrix.platform }}
          path: ${{ matrix.platform == 'macOS' && 'release/Loop-*.zip' || 'release/Loop-*-x64-setup.exe' }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Verify update metadata against real bytes
        run: node tools/verify-update-artifacts.cjs release
      - name: Upload verified assets directly to draft
        run: node tools/release-draft.cjs upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      # Only manifests travel to the final job. Installers, blockmaps,
      # release/latest.yml and release/latest-mac.yml are already in the draft.
      - name: Stage platform verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.platform }}
          path: release-manifests/*.json
          if-no-files-found: error
          retention-days: 7

  cross-platform-task-share:
    name: Verify task package on ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            sender: Windows
            os: macos-latest
          - platform: Windows
            sender: macOS
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            services/bug-report/package-lock.json
      - run: npm ci
      - name: Download the packaged receiver
        uses: actions/download-artifact@v4
        with:
          name: task-share-candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/task-share-candidate
      - name: Download the opposite-platform sample
        uses: actions/download-artifact@v4
        with:
          name: task-share-sender-${{ matrix.sender }}
          path: ${{ runner.temp }}/task-share-sender
      - name: Launch the packaged macOS application
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          arch=$(uname -m)
          if [ "$arch" = x86_64 ]; then arch=x64; fi
          archive=("$RUNNER_TEMP"/task-share-candidate/Loop-*-"$arch".zip)
          test "${#archive[@]}" -eq 1 && test -f "${archive[0]}"
          mkdir "$RUNNER_TEMP/task-share-receiver"
          ditto -x -k "${archive[0]}" "$RUNNER_TEMP/task-share-receiver"
          executable="$RUNNER_TEMP/task-share-receiver/Loop.app/Contents/MacOS/Loop"
          test -x "$executable"
          echo "LOOP_APP_EXECUTABLE=$executable" >> "$GITHUB_ENV"
      - name: Install the Windows receiver
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'task-share-candidate') -Filter 'Loop-*-x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected a single Windows candidate installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'task-share-receiver'
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed: $($process.ExitCode)" }
          $executable = Join-Path $destination 'Loop.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'Packaged Loop.exe is missing.' }
          "LOOP_APP_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Import and first-save the opposite-platform sample
        env:
          LOOP_TASK_SHARE_QA_DIR: ${{ runner.temp }}/task-share-receiver-evidence
        run: node tests/task-share-packaged.ui.cjs consume "${{ runner.temp }}/task-share-sender/sample.looptask"
      - name: Preserve task-package receiver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-share-receiver-${{ matrix.platform }}
          path: ${{ runner.temp }}/task-share-receiver-evidence
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish complete verified release
    needs: [prepare, build, cross-platform-task-share]
    concurrency:
      group: release-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install publication dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Collect small verification manifests
        uses: actions/download-artifact@v4
        with:
          pattern: release-manifest-*
          path: release-manifests
          merge-multiple: true
      - name: Verify complete cross-platform feed and publish draft
        # Equivalent --require-all-platforms gate: verified local feed SHA-512
        # plus GitHub's server SHA-256 of every uploaded asset.
        run: node tools/release-draft.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
